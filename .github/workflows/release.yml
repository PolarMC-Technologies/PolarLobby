name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (for example: v1.0.0)"
        required: true
      release_name:
        description: "Release title"
        required: false

permissions:
  contents: write

env:
  PROJECT_NAME: PolarLobby

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package

      - name: Collect release artifacts
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release-artifacts
          shopt -s nullglob
          excluded_patterns=("original-*" "*-sources.jar" "*-javadoc.jar")

          for jar in target/*.jar; do
            filename="$(basename "$jar")"
            skip_file=false
            for pattern in "${excluded_patterns[@]}"; do
              if [[ "$filename" == $pattern ]]; then
                skip_file=true
                break
              fi
            done

            if [[ "$skip_file" == true ]]; then
              continue
            fi
            cp "$jar" release-artifacts/
          done

          if ! compgen -G "release-artifacts/*.jar" > /dev/null; then
            echo "No release JAR artifacts were found in release-artifacts/."
            echo "Check that the Maven build produced a runnable JAR and that artifact filtering did not exclude all files."
            exit 1
          fi

      - name: Create or update GitHub release with artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.release_name || format('{0} {1}', env.PROJECT_NAME, github.event.inputs.tag || github.ref_name) }}
          files: |
            release-artifacts/*.jar
