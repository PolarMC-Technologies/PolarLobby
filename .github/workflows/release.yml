name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (for example: v1.0.0)"
        required: true
      release_name:
        description: "Release title"
        required: false

permissions:
  contents: write

env:
  PROJECT_NAME: PolarLobby
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package

      - name: Collect release artifacts
        run: |
          mkdir -p release-artifacts
          shopt -s nullglob

          for jar in target/"$PROJECT_NAME"-*.jar; do
            filename="$(basename "$jar")"
            if [[ "$filename" == original-* || "$filename" == *-sources.jar || "$filename" == *-javadoc.jar ]]; then
              continue
            fi
            cp "$jar" release-artifacts/
          done

          if ! ls release-artifacts/*.jar >/dev/null 2>&1; then
            echo "No release JAR artifacts were found."
            exit 1
          fi

      - name: Create or update GitHub release with artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ github.event.inputs.release_name || format('{0} {1}', env.PROJECT_NAME, env.RELEASE_TAG) }}
          files: |
            release-artifacts/*.jar
